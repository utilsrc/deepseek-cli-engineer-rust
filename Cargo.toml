[package]
name = "deepseek-cli-engineer-rust"
version = "1.0.1"
edition = "2021"
authors = ["Phyuany <phyuany@foxmail.com>"]
description = "A simplified Rust implementation of DeepSeek Cli Engineer with streaming support"
license = "MIT"

[[bin]]
name = "dse"
path = "src/main.rs"

[dependencies]
unicode-width = "0.1"
# HTTP client for API requests
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment variables
dotenvy = "0.15"

# Terminal colors
colored = "2.0"
crossterm = "0.27"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
